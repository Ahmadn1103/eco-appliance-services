        - heading "Honest Service. Upfront Pricing. Work You Can Trust." [level=2] [ref=f1e367]
        - paragraph [ref=f1e368]: When a refrigerator warms up, air ducts spread dust, or a washer fails mid-cycle, you don’t need guesswork. You need a professional who knows these systems inside and out.
