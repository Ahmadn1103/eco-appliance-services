        - heading "Honest Service. Upfront Pricing. Work You Can Trust." [level=2] [ref=f2e350]
        - paragraph [ref=f2e351]: When a refrigerator warms up, air ducts spread dust, or a washer fails mid-cycle, you don’t need guesswork. You need a professional who knows these systems inside and out.
