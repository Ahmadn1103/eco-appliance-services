        - generic [ref=f14e429]: The Eco Appliance Standard
        - heading "Honest Service. Upfront Pricing. Work You Can Trust." [level=2] [ref=f14e433]
        - paragraph [ref=f14e434]: When a refrigerator warms up, air ducts spread dust, or a washer fails mid-cycle, you don’t need guesswork. You need a professional who knows these systems inside and out.
        - list [ref=f14e435]:
          - listitem [ref=f14e436]:
            - generic [ref=f14e440]:
              - strong [ref=f14e441]: Skilled, Dependable Technicians.
              - text: Our technicians are trained to diagnose and repair HVAC, air duct, refrigeration, laundry, and kitchen appliance failures, and to get it right the first time.
          - listitem [ref=f14e442]:
            - generic [ref=f14e446]:
              - strong [ref=f14e447]: Honest Diagnosis & Integrity.
              - text: No aggressive sales tactics or unneeded part swaps. We inspect thoroughly and advise you honestly whether repair or replacement makes the best financial sense.
          - listitem [ref=f14e448]:
            - generic [ref=f14e452]:
              - strong [ref=f14e453]: Home Warranty Claims Welcome.
              - text: We work with major home warranty providers, including American Home Shield, Choice, and First American, so your claim is handled smoothly.
          - listitem [ref=f14e454]:
            - generic [ref=f14e458]:
              - strong [ref=f14e459]: Upfront & Transparent Pricing.
              - text: You will always receive a clear, itemized quote before any work starts. If you proceed with our repair, our initial diagnostic fee is applied 100% directly toward your service!
          - listitem [ref=f14e460]:
            - generic [ref=f14e464]:
              - strong [ref=f14e465]: Stocked Mobile Warehouses.
              - text: Our service vehicles carry high-failure OEM parts, high-grade diagnostic tools, and testing meters, allowing us to complete most repairs in a single visit.
          - listitem [ref=f14e466]:
            - generic [ref=f14e470]:
              - strong [ref=f14e471]: 30-Day Parts & Labor Guarantee.
