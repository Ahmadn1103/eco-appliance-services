            - generic [ref=f18e318]:
              - strong [ref=f18e319]: Upfront & Transparent Pricing.
              - text: You will always receive a clear, itemized quote before any work starts. If you proceed with our repair, our initial diagnostic fee is applied 100% directly toward your service!
          - listitem [ref=f18e320]:
            - generic [ref=f18e324]:
              - strong [ref=f18e325]: Stocked Mobile Warehouses.
              - text: Our service vehicles carry high-failure OEM parts, high-grade diagnostic tools, and testing meters, allowing us to complete most repairs in a single visit.
          - listitem [ref=f18e326]:
            - generic [ref=f18e330]:
