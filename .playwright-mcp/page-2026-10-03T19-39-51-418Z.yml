      - generic [ref=f5e462]:
        - generic [ref=f5e463]: The Eco Appliance Standard
        - heading "Honest Service. Upfront Pricing. Work You Can Trust." [level=2] [ref=f5e467]
        - paragraph [ref=f5e468]: When a refrigerator warms up, air ducts spread dust, or a washer fails mid-cycle, you don’t need guesswork. You need a professional who knows these systems inside and out.
        - list [ref=f5e469]:
          - listitem [ref=f5e470]:
            - generic [ref=f5e474]:
              - strong [ref=f5e475]: Skilled, Dependable Technicians.
              - text: Our technicians are trained to diagnose and repair HVAC, air duct, refrigeration, laundry, and kitchen appliance failures, and to get it right the first time.
          - listitem [ref=f5e476]:
            - generic [ref=f5e480]:
              - strong [ref=f5e481]: Honest Diagnosis & Integrity.
              - text: No aggressive sales tactics or unneeded part swaps. We inspect thoroughly and advise you honestly whether repair or replacement makes the best financial sense.
          - listitem [ref=f5e482]:
            - generic [ref=f5e486]:
              - strong [ref=f5e487]: Home Warranty Claims Welcome.
              - text: We work with major home warranty providers, including American Home Shield, Choice, and First American, so your claim is handled smoothly.
          - listitem [ref=f5e488]:
            - generic [ref=f5e492]:
              - strong [ref=f5e493]: Upfront & Transparent Pricing.
              - text: You will always receive a clear, itemized quote before any work starts. If you proceed with our repair, our initial diagnostic fee is applied 100% directly toward your service!
          - listitem [ref=f5e494]:
            - generic [ref=f5e498]:
              - strong [ref=f5e499]: Stocked Mobile Warehouses.
              - text: Our service vehicles carry high-failure OEM parts, high-grade diagnostic tools, and testing meters, allowing us to complete most repairs in a single visit.
          - listitem [ref=f5e500]:
            - generic [ref=f5e504]:
              - strong [ref=f5e505]: 30-Day Parts & Labor Guarantee.
