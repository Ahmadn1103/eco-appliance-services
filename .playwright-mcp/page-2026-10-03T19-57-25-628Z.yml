      - generic [ref=f10e460]:
        - generic [ref=f10e461]: The Eco Appliance Standard
        - heading "Honest Service. Upfront Pricing. Work You Can Trust." [level=2] [ref=f10e465]
        - paragraph [ref=f10e466]: When a refrigerator warms up, air ducts spread dust, or a washer fails mid-cycle, you don’t need guesswork. You need a professional who knows these systems inside and out.
        - list [ref=f10e467]:
          - listitem [ref=f10e468]:
            - generic [ref=f10e472]:
              - strong [ref=f10e473]: Skilled, Dependable Technicians.
              - text: Our technicians are trained to diagnose and repair HVAC, air duct, refrigeration, laundry, and kitchen appliance failures, and to get it right the first time.
          - listitem [ref=f10e474]:
            - generic [ref=f10e478]:
              - strong [ref=f10e479]: Honest Diagnosis & Integrity.
              - text: No aggressive sales tactics or unneeded part swaps. We inspect thoroughly and advise you honestly whether repair or replacement makes the best financial sense.
          - listitem [ref=f10e480]:
            - generic [ref=f10e484]:
              - strong [ref=f10e485]: Home Warranty Claims Welcome.
              - text: We work with major home warranty providers, including American Home Shield, Choice, and First American, so your claim is handled smoothly.
          - listitem [ref=f10e486]:
            - generic [ref=f10e490]:
              - strong [ref=f10e491]: Upfront & Transparent Pricing.
              - text: You will always receive a clear, itemized quote before any work starts. If you proceed with our repair, our initial diagnostic fee is applied 100% directly toward your service!
          - listitem [ref=f10e492]:
            - generic [ref=f10e496]:
              - strong [ref=f10e497]: Stocked Mobile Warehouses.
              - text: Our service vehicles carry high-failure OEM parts, high-grade diagnostic tools, and testing meters, allowing us to complete most repairs in a single visit.
          - listitem [ref=f10e498]:
            - generic [ref=f10e502]:
              - strong [ref=f10e503]: 30-Day Parts & Labor Guarantee.
              - text: We stand behind the quality of our work. Every repair is backed by a 30-day comprehensive parts and labor warranty for complete peace of mind.
