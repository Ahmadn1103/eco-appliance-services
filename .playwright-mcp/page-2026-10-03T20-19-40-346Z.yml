      - generic [ref=f15e460]:
        - generic [ref=f15e461]: The Eco Appliance Standard
        - heading "Honest Service. Upfront Pricing. Work You Can Trust." [level=2] [ref=f15e465]
        - paragraph [ref=f15e466]: When a refrigerator warms up, air ducts spread dust, or a washer fails mid-cycle, you don’t need guesswork. You need a professional who knows these systems inside and out.
        - list [ref=f15e467]:
          - listitem [ref=f15e468]:
            - generic [ref=f15e472]:
              - strong [ref=f15e473]: Skilled, Dependable Technicians.
              - text: Our technicians are trained to diagnose and repair HVAC, air duct, refrigeration, laundry, and kitchen appliance failures, and to get it right the first time.
          - listitem [ref=f15e474]:
            - generic [ref=f15e478]:
              - strong [ref=f15e479]: Honest Diagnosis & Integrity.
              - text: No aggressive sales tactics or unneeded part swaps. We inspect thoroughly and advise you honestly whether repair or replacement makes the best financial sense.
          - listitem [ref=f15e480]:
            - generic [ref=f15e484]:
              - strong [ref=f15e485]: Home Warranty Claims Welcome.
              - text: We work with major home warranty providers, including American Home Shield, Choice, and First American, so your claim is handled smoothly.
          - listitem [ref=f15e486]:
            - generic [ref=f15e490]:
              - strong [ref=f15e491]: Upfront & Transparent Pricing.
              - text: You will always receive a clear, itemized quote before any work starts. If you proceed with our repair, our initial diagnostic fee is applied 100% directly toward your service!
          - listitem [ref=f15e492]:
            - generic [ref=f15e496]:
              - strong [ref=f15e497]: Stocked Mobile Warehouses.
              - text: Our service vehicles carry high-failure OEM parts, high-grade diagnostic tools, and testing meters, allowing us to complete most repairs in a single visit.
          - listitem [ref=f15e498]:
            - generic [ref=f15e502]:
              - strong [ref=f15e503]: 30-Day Parts & Labor Guarantee.
