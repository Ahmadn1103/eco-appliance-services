        - generic [ref=f11e429]: The Eco Appliance Standard
        - heading "Honest Service. Upfront Pricing. Work You Can Trust." [level=2] [ref=f11e433]
        - paragraph [ref=f11e434]: When a refrigerator warms up, air ducts spread dust, or a washer fails mid-cycle, you don’t need guesswork. You need a professional who knows these systems inside and out.
        - list [ref=f11e435]:
          - listitem [ref=f11e436]:
            - generic [ref=f11e440]:
              - strong [ref=f11e441]: Skilled, Dependable Technicians.
              - text: Our technicians are trained to diagnose and repair HVAC, air duct, refrigeration, laundry, and kitchen appliance failures, and to get it right the first time.
          - listitem [ref=f11e442]:
            - generic [ref=f11e446]:
              - strong [ref=f11e447]: Honest Diagnosis & Integrity.
              - text: No aggressive sales tactics or unneeded part swaps. We inspect thoroughly and advise you honestly whether repair or replacement makes the best financial sense.
          - listitem [ref=f11e448]:
            - generic [ref=f11e452]:
              - strong [ref=f11e453]: Home Warranty Claims Welcome.
              - text: We work with major home warranty providers, including American Home Shield, Choice, and First American, so your claim is handled smoothly.
          - listitem [ref=f11e454]:
            - generic [ref=f11e458]:
              - strong [ref=f11e459]: Upfront & Transparent Pricing.
              - text: You will always receive a clear, itemized quote before any work starts. If you proceed with our repair, our initial diagnostic fee is applied 100% directly toward your service!
          - listitem [ref=f11e460]:
            - generic [ref=f11e464]:
              - strong [ref=f11e465]: Stocked Mobile Warehouses.
              - text: Our service vehicles carry high-failure OEM parts, high-grade diagnostic tools, and testing meters, allowing us to complete most repairs in a single visit.
          - listitem [ref=f11e466]:
            - generic [ref=f11e470]:
              - strong [ref=f11e471]: 30-Day Parts & Labor Guarantee.
